# NV-ACES Skill Evaluation Configuration

# Directories containing skills.
skills_dirs:
  - ".agents/skills/"

# Minimum Tier 1 quality score to pass (0-100).
# Set quality.blocking: true below when this should block merge.
min_score: 70

# Security severity that fails the security job (low, medium, high, critical, none).
# Set security.blocking: true below when this should block merge.
security_fail_on: high

# --- Optional settings (uncomment to customize) ---
# Schema note: the legacy flat keys above remain supported.
# You may replace equivalent flat keys with the nested schema below when migrating.
# Prefer one style per setting; if both are present, flat keys win for backward compatibility.

# Tier 2 LLM-as-Judge runs automatically in CI by default.
# This needs an sk-* key from: https://inference.nvidia.com/key-management
# Set false to make the Tier 2 job exit without judge work.
# To hide the Tier 2 job before scripts run, set SKILL_EVAL_TIER2_ENABLED=false as a CI variable.
# tier2_enabled: false

# Tier 2 judge model (default: nvidia/nvidia/nemotron-3-super-v3 with fallback to discovered key-allowed chat models).
# Override for cost or quality only when your NVIDIA key is entitled to the model.
# Examples: nvidia/nvidia/nemotron-3-super-v3, nvidia/meta/llama-3.3-70b-instruct
# tier2_judge_model: nvidia/nvidia/nemotron-3-super-v3

# New nested schema examples, shown with the non-blocking defaults:
# quality:
#   threshold: 70      # replaces min_score
#   blocking: false    # set true when Tier 1 should block merge
# security:
#   fail_on: high      # replaces security_fail_on
#   blocking: false    # set true when security findings should block merge
# llm_judge:
#   enabled: true      # replaces tier2_enabled
#   model: nvidia/nvidia/nemotron-3-super-v3  # replaces tier2_judge_model
#   blocking: false    # Tier 2 is advisory by default
# agent_eval:
#   enabled: true
#   # Default CI live-agent runner is Harbor local mode inside the CI job boundary.
#   runner: harbor      # CI-supported runner
#   # Use docker/astra-sandbox for shared shell runners.
#   env_mode: local     # local | docker | astra-sandbox (Harbor only)
#   harnesses: [codex]  # e.g. [codex, claude-code, opencode] (Harbor only)
#   # Runtime policy; set SKILL_EVAL_AGENT_EVAL_BLOCKING=true as a CI variable
#   # when the automatic agent-eval job itself should block merge.
#   blocking: false

# Pipeline shape controls belong in .gitlab-ci.yml variables or GitLab CI/CD variables:
#   SKILL_EVAL_GATING=true          # legacy quality/security/agent-eval gating shorthand
#   SKILL_EVAL_TIER2_ENABLED=false  # hide the Tier 2 job entirely
#   SKILL_EVAL_AGENT_EVAL_BLOCKING=true  # make agent eval block on failure
#   SKILL_EVAL_ENV_MODE=local       # Harbor backend
#   # Use docker/astra-sandbox when host isolation is not enough.
#   SKILL_EVAL_AGENT_HARNESSES=codex,claude-code
#   SKILL_EVAL_AGENT_IMAGE=""       # hide agent-eval job
