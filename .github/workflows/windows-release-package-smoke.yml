name: Windows release package smoke

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Upstream release tag to test"
        required: true
        default: "v1.1.0"
        type: string
      asset_pattern:
        description: "Exactly one Windows CPython 3.12 release asset pattern"
        required: true
        default: "*usd_25.11_py_3.12@*.windows-x86_64.release.zip"
        type: string

permissions:
  contents: read

jobs:
  smoke:
    name: Windows package smoke (${{ inputs.release_tag }})
    runs-on: windows-2022
    timeout-minutes: 30

    steps:
      - name: Check out smoke harness
        uses: actions/checkout@v4

      - name: Set up CPython 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download upstream Windows package
        id: package
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $downloadDirectory = Join-Path $env:RUNNER_TEMP "usd-optimize-release"
          New-Item -ItemType Directory -Force -Path $downloadDirectory | Out-Null
          gh release download "${{ inputs.release_tag }}" `
            --repo NVIDIA-Omniverse/usd-optimize `
            --pattern "${{ inputs.asset_pattern }}" `
            --dir $downloadDirectory
          $archives = Get-ChildItem -LiteralPath $downloadDirectory -Filter "*.zip" -File
          if ($archives.Count -ne 1) {
            throw "Expected exactly one release package, found $($archives.Count)."
          }
          "archive=$($archives[0].FullName)" >> $env:GITHUB_OUTPUT

      - name: Smoke-test the released package
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python tools/release_smoke/windows_package_smoke.py `
            --package-archive "${{ steps.package.outputs.archive }}" `
            --overlap-fixture-usd source/tests/data/sphere_clashes_frame.usda 2>&1 |
            Tee-Object -FilePath release-package-smoke.log
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Upload smoke log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-release-package-smoke-${{ inputs.release_tag }}
          path: release-package-smoke.log
          if-no-files-found: warn
          retention-days: 14
